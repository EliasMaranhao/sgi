# ===================================================================
# CONFIGURAÇÕES DO SERVIDOR
# ===================================================================
server.port=8080
server.servlet.context-path=/api

# ===================================================================
# CONFIGURAÇÃO DE DATASOURCE GLOBAL (Banco Físico)
# ===================================================================
# Substitua 'sgi_db' pelo nome do seu banco de dados principal/root
spring.datasource.url=jdbc:mysql://localhost:3306/sgi_public?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de Conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# CONFIGURAÇÕES DA JPA / HIBERNATE (Multi-Tenant)
# ===================================================================
# Define o dialeto específico para o MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Sinaliza ao Hibernate a estratégia de multi-tenancy por catálogo/schema
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# Desativa o DDL automático para que o Hibernate não tente gerar tabelas 
# nos schemas errados em tempo de execução
spring.jpa.hibernate.ddl-auto=none

# Configurações de Log para debug das Queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Mantém o padrão do banco em snake_case (ex: usuario_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-ultra-segura-123}

# Ativa o Flyway para o banco principal
spring.flyway.enabled=true

# Aponta explicitamente APENAS para a pasta do schema principal
spring.flyway.locations=classpath:db/migration/main